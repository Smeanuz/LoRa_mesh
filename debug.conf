# Kconfig bổ sung cho bản debug (thêm qua -DEXTRA_CONF_FILE=debug.conf)
# -Og thay cho -Os: step từng dòng chính xác, xem được biến local
CONFIG_DEBUG_OPTIMIZATIONS=y
# Cho J-Link GDB Server đọc danh sách thread Zephyr (panel RTOS / Call Stack)
CONFIG_DEBUG_THREAD_INFO=y
# Đặt tên thread và đo stack usage
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
